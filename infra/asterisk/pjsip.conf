[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[webrtc-endpoint](!)
type=endpoint
transport=transport-wss
context=from-browser
disallow=all
allow=ulaw,alaw
webrtc=yes
dtls_auto_generate_cert=yes
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=yes
dtmf_mode=rfc4733

#tryinclude "generated/endpoints.conf"
#tryinclude "carrier.conf"
